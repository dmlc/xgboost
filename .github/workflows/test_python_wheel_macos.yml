name: Test macOS Python wheel

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform_id:
        required: true
        type: string
      test_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dmlc/xgboost-devops/actions/miniforge-setup@main
        with:
          environment-name: macos_cpu_test
          environment-file: ops/conda_env/macos_cpu_test.yml
      - name: Download macOS wheel artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-wheel-${{ inputs.platform_id }}
          path: wheelhouse
      - name: Install XGBoost wheel
        run: python -m pip install -v wheelhouse/*.whl
      - name: Run Python tests
        run: python -m pytest -s -v -rxXs --durations=0 "${{ inputs.test_path }}"
      - name: Run Dask tests
        if: inputs.os != 'macos-15-intel'
        run: python -m pytest -s -v -rxXs --durations=0 tests/test_distributed/test_with_dask
