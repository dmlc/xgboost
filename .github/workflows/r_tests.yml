name: R Tests

on:
  push:
    branches:
      - master
      - 'release_*'
  pull_request:

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-Rpkg:
    runs-on: ${{ matrix.os }}
    name: Test R on OS ${{ matrix.os }}, R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            r: release
          - os: macos-latest
            r: release
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'true'
      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: ${{ matrix.r }}
      - uses: r-lib/actions/setup-pandoc@v2.12.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          architecture: 'x64'
      - uses: r-lib/actions/setup-tinytex@v2.12.1
      - uses: dmlc/xgboost-devops/actions/sccache@main
      - run: cmake --version
      - name: Configure R to use sccache
        run: Rscript --vanilla ops/script/setup_r_sccache.R
      - name: Install dependencies
        shell: Rscript {0}
        run: |
          source("./R-package/tests/helper_scripts/install_deps.R")
      - name: Test R
        run: |
          python ops/script/test_r_package.py --task=check --print-install-log
      - run: sccache --show-stats

  test-R-on-Debian:
    name: Test R package on Debian
    runs-on: ubuntu-latest
    container:
      image: rhub/ubuntu-release # rhub uses ubuntu for debian tests.
    steps:
      - name: Install system dependencies
        run: |
          # Must run before checkout to have the latest git installed.
          apt update && apt install libcurl4-openssl-dev libssl-dev libssh2-1-dev libgit2-dev libglpk-dev libxml2-dev libharfbuzz-dev libfribidi-dev git librsvg2-dev librsvg2-2 pandoc libuv1-dev -y
          # cmake is required by the R `fs` package if it builds its bundled libuv.
          apt install cmake -y
      - name: Trust git cloning project sources
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'true'
      - uses: dmlc/xgboost-devops/actions/sccache@main
      - run: Rscript --vanilla ops/script/setup_r_sccache.R
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          Rscript -e "source('./R-package/tests/helper_scripts/install_deps.R')"
      - name: Test R
        shell: bash -l {0}
        run: |
          python3 ops/script/test_r_package.py --r=/opt/R/release/bin/R --task=check --print-install-log
      - uses: dorny/paths-filter@v4
        # Run the document check if there are changes in the R package.
        id: changes
        with:
          filters: |
            r_package:
              - 'R-package/**'
      - name: Run document check
        if: steps.changes.outputs.r_package == 'true'
        run: |
          python3 ops/script/test_r_package.py --r=/opt/R/release/bin/R --task=doc
      - name: Run lintr
        run: |
          # Prevent the linter from checking generated R scripts.
          if [ -d ./xgboost.Rcheck ] ; then
            rm -rf ./xgboost.Rcheck
          fi
          CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)" R CMD INSTALL R-package/
          Rscript ops/script/lint_r.R $(pwd)
      - run: sccache --show-stats
