name: Measure GPU container startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Compare initial and cached container startup
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=linux-amd64-gpu
      - tag=container-startup-experiment
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Log into Docker registry (AWS ECR)
        run: bash ops/pipeline/login-docker-registry.sh
      - name: Measure startup
        run: bash ops/pipeline/measure-container-startup.sh
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-startup
          path: container-startup-results/
          retention-days: 14
