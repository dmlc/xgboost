name: Windows

on:
  push:
    branches:
      - master
      - 'release_*'
  pull_request:

permissions:
  contents: read  # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

env:
  BRANCH_NAME: >-
    ${{ github.event.pull_request.number && 'PR-' }}${{ github.event.pull_request.number || github.ref_name }}

jobs:
  build-win64-gpu:
    name: Build XGBoost for Windows with CUDA
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=windows-cpu
      - tag=windows-build-win64-gpu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"
      - uses: dmlc/xgboost-devops/actions/msvc-dev-env@main
      - uses: dmlc/xgboost-devops/actions/sccache@main
        with:
          # Master caches both SM75 and full builds; PRs restore without saving snapshots.
          cache-key-prefix: ${{ github.job }}-cuda
          restore-only: ${{ github.ref != 'refs/heads/master' }}
      - run: ops/pipeline/build-win64.ps1 -variant gpu
      - run: sccache --show-stats
      - name: Stash files
        shell: powershell
        run: |
          conda activate
          python ops/pipeline/manage-artifacts.py upload `
            --s3-bucket ${{ env.RUNS_ON_S3_BUCKET_CACHE }} `
            --prefix cache/${{ github.run_id }}/build-win64-gpu `
            build/testxgboost.exe `
            (Get-ChildItem python-package/dist/*.whl | Select-Object -Expand FullName)

  build-win64-cpu:
    name: Build XGBoost for Windows (minimal)
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=windows-cpu
      - tag=windows-build-win64-cpu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"
      - uses: dmlc/xgboost-devops/actions/msvc-dev-env@main
      - uses: dmlc/xgboost-devops/actions/sccache@main
      - run: ops/pipeline/build-win64.ps1 -variant cpu
      - run: sccache --show-stats

  test-win64:
    name: Test XGBoost on Windows (${{ matrix.suite }})
    # Both suites test the same CUDA-enabled wheel; compile it only once.
    needs: build-win64-gpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cpu
            runner: windows-cpu
          - suite: gpu
            runner: windows-gpu
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=${{ matrix.runner }}
      - tag=windows-test-win64-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"
      - name: Set up Python test environment
        id: test-env
        uses: ./.github/actions/setup-windows-test-env
        with:
          # Only one suite compresses/uploads the shared environment on master.
          save-cache: ${{ matrix.suite == 'cpu' }}
      - name: Unstash files
        shell: powershell
        run: |
          conda activate
          python ops/pipeline/manage-artifacts.py download `
            --s3-bucket ${{ env.RUNS_ON_S3_BUCKET_CACHE }} `
            --prefix cache/${{ github.run_id }}/build-win64-gpu `
            --dest-dir build `
            *.whl testxgboost.exe
          New-Item -ItemType Directory -Path python-package/dist/ -Force
          Move-Item -Path (Get-ChildItem build/*.whl | Select-Object -Expand FullName) `
            -Destination python-package/dist/
      - run: powershell ops/pipeline/test-win64.ps1 -Suite '${{ matrix.suite }}' -CondaEnv '${{ steps.test-env.outputs.prefix }}'

  build-win-arm64:
    name: Build XGBoost for Windows ARM64 (${{ matrix.variant }})
    # TODO(win-arm64-runner): Switch to self-hosted runner labels, like the x64 jobs.
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [gpu, cpu]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "true"
      # TODO(win-arm64-runner): Drop the Python, build dependency and CUDA steps below if
      # the self-hosted image provides conda, CMake 4.4+ and the CUDA Toolkit like the x64 image.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # CMake 4.4+ is required to locate the CUDA libraries for Windows ARM64.
          python -m pip install wheel setuptools awscli packaging "cmake>=4.4"
      - name: Install CUDA Toolkit
        if: matrix.variant == 'gpu'
        # Windows ARM64 builds of the CUDA Toolkit are available starting with CUDA 13.4.1.
        run: ops/pipeline/install-cuda-redist.ps1 -Version 13.4.3 -InstallDir "$Env:RUNNER_TEMP\cuda"
      - uses: dmlc/xgboost-devops/actions/msvc-dev-env@main
      - uses: dmlc/xgboost-devops/actions/sccache@main
        with:
          cache-key-prefix: ${{ github.job }}-${{ matrix.variant }}
          # Master caches both SM75 and full CUDA builds; PRs restore without saving snapshots.
          restore-only: ${{ matrix.variant == 'gpu' && github.ref != 'refs/heads/master' }}
      - run: ops/pipeline/build-win64.ps1 -variant ${{ matrix.variant }}
        env:
          # GitHub-hosted runners have no instance role for the nightly wheel upload.
          # TODO(win-arm64-runner): Remove if the self-hosted runner has an instance role.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_IAM_S3_UPLOADER }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_IAM_S3_UPLOADER }}
      - run: sccache --show-stats
      - name: Upload Python wheel as workflow artifact
        if: matrix.variant == 'gpu'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-wheel-win-arm64
          path: python-package/dist/*.whl
          retention-days: 1

  # TODO(win-arm64-runner): GitHub-hosted runners have no GPU, so this only checks that the
  # CUDA wheel works on CPU. With a self-hosted GPU runner, replace this job with a
  # test-win64-style matrix that runs testxgboost.exe and tests/python-gpu.
  test-win-arm64:
    name: Test XGBoost on Windows ARM64
    needs: build-win-arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install hypothesis pytest scikit-learn pandas
      - name: Download Python wheel
        uses: actions/download-artifact@v8.0.1
        with:
          name: python-wheel-win-arm64
          path: wheelhouse
      - name: Install Python wheel
        run: |
          $wheelFile = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1 -ExpandProperty FullName
          python -m pip install -v $wheelFile
          python -c "import xgboost; info = xgboost.build_info(); print(info); assert info['USE_CUDA']"
      - name: Run Python tests
        run: python -m pytest -v -s -rxXs --durations=0 tests/python/test_basic.py
